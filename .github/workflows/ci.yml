name: Verify

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - name: Test with race detector
        working-directory: server
        run: go test -race ./...
      - name: Vet
        working-directory: server
        run: go vet ./...
      - name: Verify module checksums
        working-directory: server
        run: go mod verify
      - name: Scan Go vulnerabilities
        working-directory: server
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run format:check
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run test
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm audit --audit-level=high
        working-directory: web

  e2e:
    runs-on: ubuntu-latest
    needs: [go, web]
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: chromium, browser: chromium }
          - { project: firefox, browser: firefox }
          - { project: webkit, browser: webkit }
          - { project: mobile-chromium, browser: chromium }
          - { project: mobile-webkit, browser: webkit }
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm ci
        working-directory: e2e
      - run: npm run typecheck
        working-directory: e2e
      - run: npm audit --audit-level=high
        working-directory: e2e
      - run: npx playwright install --with-deps ${{ matrix.browser }}
        working-directory: e2e
      - name: Two-context regression (${{ matrix.project }})
        run: npm run test:matrix -- --project=${{ matrix.project }}
        working-directory: e2e

  container-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Build production image
        run: docker build --file deploy/Dockerfile --tag ghost-chat:ci .
      - name: Validate Compose configuration
        run: docker compose --file deploy/compose.yaml config --quiet
        env:
          PUBLIC_ORIGIN: https://chat.example
      - name: Smoke-test read-only non-root container
        run: |
          docker run --detach --name ghost-chat-ci --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true --ulimit core=0:0 \
            --publish 127.0.0.1:8080:8080 \
            --env ALLOWED_ORIGINS=http://127.0.0.1:8080 ghost-chat:ci
          trap 'docker rm --force ghost-chat-ci >/dev/null' EXIT
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:8080/healthz
          curl --fail --output /dev/null http://127.0.0.1:8080/
      - run: npm ci
        working-directory: e2e
      - run: npm run typecheck
        working-directory: e2e
      - name: Install isolated TLS test prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libnss3-tools
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - name: Production container conversation through verified HTTPS and WSS
        run: node scripts/container-e2e.mjs --project=chromium
