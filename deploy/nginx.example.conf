# Include inside nginx's http context. Replace the domain and certificate paths.
map $http_upgrade $ghost_chat_connection {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name chat.example;
    access_log off;
    error_log /dev/null;
    return 308 https://chat.example$request_uri;
}

server {
    listen 443 ssl;
    server_name chat.example;
    server_tokens off;
    ssl_certificate /etc/letsencrypt/live/chat.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache off;
    ssl_session_tickets off;
    access_log off;
    error_log /dev/null;
    client_max_body_size 8k;
    client_body_buffer_size 16k;
    client_body_timeout 5s;
    keepalive_timeout 30s;
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ghost_chat_connection;
        proxy_set_header Origin $http_origin;
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header Forwarded "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 10s;
        proxy_read_timeout 65s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_no_cache 1;
    }
}
