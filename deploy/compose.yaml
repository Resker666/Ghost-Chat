name: ghost-chat

services:
  ghost-chat:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: runtime
    image: ghost-chat:local
    restart: unless-stopped
    user: "65532:65532"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${HOST_PORT:-8080}:8080"
    environment:
      ADDR: 0.0.0.0:8080
      WEB_DIST_DIR: /app/web
      ALLOWED_ORIGINS: "${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN to your exact HTTPS origin}"
      ROOM_TTL: "${ROOM_TTL:-30m}"
      WAITING_TTL: "${WAITING_TTL:-10m}"
      AUTH_TIMEOUT: "5s"
      WRITE_TIMEOUT: "5s"
      HEARTBEAT_INTERVAL: "15s"
      HEARTBEAT_TIMEOUT: "5s"
      MAX_ROOMS: "${MAX_ROOMS:-1000}"
      MAX_CONNECTIONS: "${MAX_CONNECTIONS:-2100}"
      CREATE_RATE_PER_MINUTE: "${CREATE_RATE_PER_MINUTE:-30}"
      UPGRADE_RATE_PER_MINUTE: "${UPGRADE_RATE_PER_MINUTE:-120}"
      MESSAGE_RATE_PER_SECOND: "${MESSAGE_RATE_PER_SECOND:-20}"
    mem_limit: 256m
    cpus: "1.0"
    pids_limit: 128
    stop_grace_period: 10s
    ulimits:
      core:
        soft: 0
        hard: 0
    logging:
      driver: none
