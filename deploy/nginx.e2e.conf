worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/null;

events {
    worker_connections 256;
}

http {
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    map $http_upgrade $ghost_chat_connection {
        default upgrade;
        '' close;
    }

    server {
        listen 8443 ssl;
        server_name localhost 127.0.0.1;
        ssl_certificate /etc/ghost-chat-test-tls/server.crt;
        ssl_certificate_key /etc/ghost-chat-test-tls/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_session_cache off;
        ssl_session_tickets off;
        client_max_body_size 8k;
        client_body_buffer_size 16k;
        client_body_timeout 5s;
        keepalive_timeout 30s;
        add_header Strict-Transport-Security "max-age=31536000" always;

        location / {
            resolver 127.0.0.11 valid=5s ipv6=off;
            set $ghost_chat_backend ghost-chat:8080;
            proxy_pass http://$ghost_chat_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $ghost_chat_connection;
            proxy_set_header Origin $http_origin;
            proxy_set_header X-Forwarded-For "";
            proxy_set_header X-Real-IP "";
            proxy_set_header Forwarded "";
            proxy_connect_timeout 5s;
            proxy_send_timeout 10s;
            proxy_read_timeout 65s;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            proxy_no_cache 1;
        }
    }
}
